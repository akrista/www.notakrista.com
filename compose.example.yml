x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: 6

x-base: &base
  build:
    context: .
    dockerfile: Dockerfile.octane
    # dockerfile: Dockerfile.nginx
    args:
      APP_ENV: "${APP_ENV:-local}"
      WWWUSER: ${HOST_UID:-1000}
      WWWGROUP: ${HOST_GID:-1000}
      TZ: ${APP_TIMEZONE:-America/Caracas}
  image: ${DOCKER_IMAGE:-notakrista.com-octane:latest}
  # image: ${DOCKER_IMAGE:-notakrista.com-php:latest}
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  ulimits:
    nofile:
      soft: 20000
      hard: 40000
  security_opt:
    - no-new-privileges:true
  networks:
    - database
    - proxy
  env_file:
    - .env
  logging: *default-logging
  restart: unless-stopped

networks:
  database:
    name: database
    external: true
  proxy:
    name: proxy
    external: true

services:
  octane:
    <<: *base
    container_name: notakrista.com-octane
    working_dir: /var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
      # - "${REVERB_PORT:-8080}:8080"
    volumes:
      - ./:/var/www/html
    environment:
      - USER=laravel
      - ROOT=/var/www/html
      - WITH_SCHEDULER=${WITH_SCHEDULER:-false}
      - WITH_WORKER=${WITH_WORKER:-false}
      - WITH_HORIZON=${WITH_HORIZON:-false}
      # - WITH_REVERB=${WITH_REVERB:-false}
      # - WITH_SSR=${WITH_SSR:-false}
      - WORKER_COMMAND=${WORKER_COMMAND:-php artisan queue:work}
      - OCTANE_SERVER=${OCTANE_SERVER:-swoole}
    healthcheck:
      test: [ "CMD", "octane-healthcheck" ]
      interval: 3s
      retries: 12
      timeout: 5s
      start_period: 10s
