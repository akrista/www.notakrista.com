[PHP]
; File uploads
post_max_size = 420M
upload_max_filesize = 400M
max_file_uploads = 20

; Security
expose_php = 0
display_errors = 0
display_startup_errors = 0
log_errors = 1
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance - optimized for long-running Octane processes
realpath_cache_size = 32M
realpath_cache_ttl = 720
max_input_time = 5
max_execution_time = 0
memory_limit = 256M
default_socket_timeout = 60
register_argc_argv = 0

; Timezone
date.timezone = ${TZ:-America/Caracas}

[Opcache]
; Enable opcache for CLI (required for Octane)
opcache.enable = 1
opcache.enable_cli = 1

; Memory settings
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16

; File settings
opcache.max_accelerated_files = 32531
opcache.max_file_size = 0
opcache.use_cwd = 0

; Validation - disabled for production performance
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.file_update_protection = 0

; Optimization
opcache.save_comments = 1
opcache.enable_file_override = 1
opcache.file_cache_consistency_checks = 0
; opcache.file_cache = /tmp/opcache-file-cache

; Error handling
opcache.log_verbosity_level = 1
opcache.error_log = /proc/self/fd/2

[JIT]
; JIT configuration for PHP 8.5
opcache.jit_buffer_size = 128M
opcache.jit = tracing
opcache.jit_hot_loop = 16
opcache.jit_hot_func = 32
opcache.jit_hot_return = 4
opcache.jit_max_root_traces = 2048
opcache.jit_max_side_traces = 256

[APCu]
apc.enabled = 1
apc.shm_size = 256M
apc.ttl = 7200
apc.gc_ttl = 3600
apc.entries_hint = 4096
apc.slam_defense = 1
apc.enable_cli = 1

[PostgreSQL]
pgsql.allow_persistent = On
pgsql.auto_reset_persistent = Off
pgsql.max_persistent = -1
pgsql.max_links = -1
