[PHP]
; File uploads
post_max_size = 100M
upload_max_filesize = 100M
max_file_uploads = 20

; Security
expose_php = 0
display_errors = 0
display_startup_errors = 0
log_errors = 1
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Performance
realpath_cache_size = 32M
realpath_cache_ttl = 600
max_input_time = 60
max_execution_time = 300
memory_limit = 512M
default_socket_timeout = 60
register_argc_argv = 0

; Timezone
date.timezone = ${TZ:-America/Caracas}

; Session (using Redis in production recommended)
session.save_handler = files
session.save_path = /var/www/html/storage/framework/sessions
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 1440

[Opcache]
; Enable opcache
opcache.enable = 1
opcache.enable_cli = 0

; Memory settings - with 20GB RAM we can be generous
opcache.memory_consumption = 512M
opcache.interned_strings_buffer = 64M

; File settings
opcache.max_accelerated_files = 100000
opcache.max_file_size = 0
opcache.use_cwd = 1

; Validation (PRODUCTION: set validate_timestamps=0 for max performance)
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.file_update_protection = 2

; Optimization
opcache.save_comments = 1
opcache.enable_file_override = 1
opcache.optimization_level = 0x7FFEBFFF

; Error handling
opcache.log_verbosity_level = 1
opcache.error_log = /proc/self/fd/2

[JIT]
; JIT configuration for PHP 8.5
opcache.jit_buffer_size = 256M
opcache.jit = tracing
opcache.jit_prof_threshold = 0.005
opcache.jit_max_root_traces = 4096
opcache.jit_max_side_traces = 512
opcache.jit_max_exit_counters = 8192

[APCu]
apc.enabled = 1
apc.shm_size = 256M
apc.ttl = 7200
apc.gc_ttl = 3600
apc.entries_hint = 4096
apc.slam_defense = 1
apc.enable_cli = 0

[zlib]
zlib.output_compression = On
zlib.output_compression_level = 6

[PostgreSQL]
pgsql.allow_persistent = On
pgsql.auto_reset_persistent = Off
pgsql.max_persistent = -1
pgsql.max_links = -1
